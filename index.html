<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNL NFL Draft 2026</title>
<meta name="description" content="SNL NFL Draft League Tracker — 2026 Season">
<meta name="theme-color" content="#013369">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --header-bg: #013369;
  --header-text: #ffffff;
  --nfl-red: #d50a0a;
  --accent: #013369;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --win: #15803d;
  --loss: #dc2626;
  --tie: #d97706;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.05);
  --radius: 14px;
  --radius-sm: 8px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a;
    --surface: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #334155;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
    --shadow-md: 0 4px 6px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --border: #334155;
  --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
  --shadow-md: 0 4px 6px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.3);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ---- HEADER ---- */
.app-header {
  background: var(--header-bg);
  color: var(--header-text);
  padding: 14px 16px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.3);
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 12px;
}

.header-icon {
  font-size: 26px;
  line-height: 1;
  flex-shrink: 0;
}

.header-text h1 {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -.2px;
  line-height: 1.15;
}

.header-text p {
  font-size: 11px;
  opacity: .65;
  margin-top: 2px;
  font-weight: 500;
  letter-spacing: .3px;
  text-transform: uppercase;
}

.header-week {
  margin-left: auto;
  text-align: right;
  flex-shrink: 0;
}

.header-week-num {
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
  display: block;
}

.header-week-label {
  font-size: 11px;
  opacity: .6;
  font-weight: 500;
}

/* ---- TABS ---- */
.tab-nav {
  display: flex;
  gap: 0;
  border-top: 1px solid rgba(255,255,255,.12);
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-nav::-webkit-scrollbar { display: none; }

.tab-btn {
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  color: rgba(255,255,255,.55);
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: .2px;
  transition: color .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
}
.tab-btn:hover { color: rgba(255,255,255,.85); }
.tab-btn.active { color: #fff; border-bottom-color: var(--nfl-red); }

/* ---- MAIN CONTENT ---- */
.main { padding: 14px; max-width: 620px; margin: 0 auto; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ---- LOADING ---- */
.loading-msg {
  text-align: center;
  padding: 48px 16px;
  color: var(--muted);
  font-size: 14px;
}
.spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .75s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- SECTION LABEL ---- */
.section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .9px;
  color: var(--muted);
  padding: 2px 2px 8px;
}

/* ---- LEADERBOARD ---- */
.lb-list { display: flex; flex-direction: column; gap: 8px; }

.lb-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.lb-rank {
  font-size: 20px;
  font-weight: 900;
  color: var(--muted);
  min-width: 30px;
  text-align: center;
  flex-shrink: 0;
}

.lb-info { flex: 1; min-width: 0; }

.lb-name {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 5px;
  letter-spacing: -.1px;
}

.lb-logos {
  display: flex;
  gap: 3px;
  align-items: center;
  flex-wrap: wrap;
}

.lb-logo {
  width: 26px;
  height: 26px;
  object-fit: contain;
  border-radius: 4px;
}

.lb-stats {
  text-align: right;
  flex-shrink: 0;
  min-width: 72px;
}

.lb-points {
  font-size: 24px;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}

.lb-record {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
}

.lb-diff {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
  margin-top: 1px;
}
.lb-diff.pos { color: var(--win); }
.lb-diff.neg { color: var(--loss); }

.scoring-note {
  margin-top: 12px;
  padding: 10px 14px;
  background: var(--surface);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

/* ---- SCHEDULE ---- */
.week-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 10px 14px;
  margin-bottom: 12px;
}

.week-nav-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  color: var(--text);
  transition: background .15s;
  -webkit-tap-highlight-color: transparent;
}
.week-nav-btn:hover:not(:disabled) { background: var(--border); }
.week-nav-btn:disabled { opacity: .3; cursor: default; }

.week-label-text {
  font-size: 15px;
  font-weight: 800;
}

.games-list { display: flex; flex-direction: column; gap: 8px; }

.game-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px 14px;
  display: grid;
  grid-template-columns: 1fr 80px 1fr;
  align-items: center;
  gap: 6px;
}

.game-team {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
}

.game-logo-wrap {
  position: relative;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.game-logo {
  width: 42px;
  height: 42px;
  object-fit: contain;
}

.game-logo-fb {
  display: none;
  width: 42px;
  height: 42px;
  border-radius: 8px;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  color: white;
}

.game-team-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
  max-width: 90px;
}

.owner-badge {
  font-size: 10px;
  font-weight: 700;
  border-radius: 20px;
  padding: 2px 7px;
  color: white;
  line-height: 1.4;
}

.score-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.score-nums {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.score-sep {
  color: var(--muted);
  font-size: 14px;
  margin: 0 2px;
  font-weight: 400;
}

.score-status {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  text-align: center;
}
.score-status.live { color: var(--nfl-red); font-weight: 700; }

.score-time {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
}

.no-games-msg {
  text-align: center;
  color: var(--muted);
  padding: 40px 16px;
  font-size: 14px;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ---- TEAMS TAB ---- */
.teams-grid { display: flex; flex-direction: column; gap: 10px; }

.participant-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.participant-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}

.participant-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
  color: white;
  flex-shrink: 0;
}

.participant-name {
  font-size: 15px;
  font-weight: 800;
  flex: 1;
}

.participant-pts {
  font-size: 15px;
  font-weight: 900;
  color: var(--accent);
}

.team-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
}
.team-row + .team-row { border-top: 1px solid var(--border); }

.team-row-logo {
  width: 34px;
  height: 34px;
  object-fit: contain;
  flex-shrink: 0;
}

.team-row-logo-fb {
  display: none;
  width: 34px;
  height: 34px;
  border-radius: 7px;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 800;
  color: white;
  flex-shrink: 0;
}

.team-row-name {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
}

.team-row-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}

.team-row-record {
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.team-row-pts {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}

/* ---- MISC ---- */
.live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--nfl-red);
  margin-right: 3px;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .3; }
}
</style>
</head>

<body>

<header class="app-header">
  <div class="header-top">
    <div class="header-icon">🏈</div>
    <div class="header-text">
      <h1>SNL NFL Draft</h1>
      <p>2026 Season Tracker</p>
    </div>
    <div class="header-week" id="header-week">
      <span class="header-week-num">—</span>
      <span class="header-week-label">Loading</span>
    </div>
  </div>
  <nav class="tab-nav" role="tablist">
    <button class="tab-btn active" data-tab="leaderboard" role="tab">Leaderboard</button>
    <button class="tab-btn" data-tab="schedule" role="tab">Schedule</button>
    <button class="tab-btn" data-tab="teams" role="tab">Teams</button>
  </nav>
</header>

<main class="main">
  <div id="tab-leaderboard" class="tab-panel active" role="tabpanel">
    <div class="loading-msg"><div class="spinner"></div>Loading scores…</div>
  </div>
  <div id="tab-schedule" class="tab-panel" role="tabpanel">
    <div class="loading-msg"><div class="spinner"></div>Loading schedule…</div>
  </div>
  <div id="tab-teams" class="tab-panel" role="tabpanel">
    <div class="loading-msg"><div class="spinner"></div>Loading rosters…</div>
  </div>
</main>

<script>
'use strict';

// ── CONSTANTS ──────────────────────────────────────────────────────────────

const TEAMS = {
  'Seattle Seahawks':      { abbr: 'sea', owner: 'Mike',   color: '#002244' },
  'Chicago Bears':         { abbr: 'chi', owner: 'Mike',   color: '#0b1f48' },
  'Cincinnati Bengals':    { abbr: 'cin', owner: 'Mike',   color: '#fb4f14' },
  'Buffalo Bills':         { abbr: 'buf', owner: 'Carlos', color: '#00338d' },
  'Houston Texans':        { abbr: 'hou', owner: 'Carlos', color: '#03202f' },
  'Jacksonville Jaguars':  { abbr: 'jax', owner: 'Carlos', color: '#006778' },
  'Los Angeles Rams':      { abbr: 'lar', owner: 'Leury',  color: '#003594' },
  'Dallas Cowboys':        { abbr: 'dal', owner: 'Leury',  color: '#003594' },
  'Indianapolis Colts':    { abbr: 'ind', owner: 'Leury',  color: '#002c5f' },
  'San Francisco 49ers':   { abbr: 'sf',  owner: 'Danny',  color: '#aa0000' },
  'Pittsburgh Steelers':   { abbr: 'pit', owner: 'Danny',  color: '#101820' },
  'New York Jets':         { abbr: 'nyj', owner: 'Danny',  color: '#125740' },
  'Philadelphia Eagles':   { abbr: 'phi', owner: 'Manny',  color: '#004c54' },
  'Green Bay Packers':     { abbr: 'gb',  owner: 'Manny',  color: '#203731' },
  'Washington Commanders': { abbr: 'wsh', owner: 'Manny',  color: '#5a1414' },
  'Baltimore Ravens':      { abbr: 'bal', owner: 'Eli',    color: '#241773' },
  'Los Angeles Chargers':  { abbr: 'lac', owner: 'Eli',    color: '#0080c6' },
  'Minnesota Vikings':     { abbr: 'min', owner: 'Eli',    color: '#4f2683' },
  'Detroit Lions':         { abbr: 'det', owner: 'Al',     color: '#0076b6' },
  'New York Giants':       { abbr: 'nyg', owner: 'Al',     color: '#0b2265' },
  'Miami Dolphins':        { abbr: 'mia', owner: 'Al',     color: '#008e97' },
  'Denver Broncos':        { abbr: 'den', owner: 'King',   color: '#fb4f14' },
  'Tampa Bay Buccaneers':  { abbr: 'tb',  owner: 'King',   color: '#d50a0a' },
  'Arizona Cardinals':     { abbr: 'ari', owner: 'King',   color: '#97233f' },
  'New England Patriots':  { abbr: 'ne',  owner: 'Jae',    color: '#002244' },
  'Kansas City Chiefs':    { abbr: 'kc',  owner: 'Jae',    color: '#e31837' },
  'New Orleans Saints':    { abbr: 'no',  owner: 'Jae',    color: '#d3bc8d' },
};

const OWNER_COLORS = {
  'Mike':   '#3b82f6',
  'Carlos': '#f59e0b',
  'Leury':  '#8b5cf6',
  'Danny':  '#ec4899',
  'Manny':  '#10b981',
  'Eli':    '#f97316',
  'Al':     '#06b6d4',
  'King':   '#84cc16',
  'Jae':    '#ef4444',
};

const OWNERS = ['Mike', 'Carlos', 'Leury', 'Danny', 'Manny', 'Eli', 'Al', 'King', 'Jae'];

// ESPN display name → our canonical name if they differ
const ESPN_NAME_MAP = {
  'Washington Commanders': 'Washington Commanders',
};

function normalizeTeam(n) { return ESPN_NAME_MAP[n] || n; }
function logoUrl(abbr)    { return `https://a.espncdn.com/i/teamlogos/nfl/500/${abbr}.png`; }

// ── STATE ──────────────────────────────────────────────────────────────────

let gamesCache  = {};   // week (string) → game[]
let currentWeek = 1;
let viewWeek    = 1;
let isPlayoffs  = false;

// ── ESPN API ───────────────────────────────────────────────────────────────

async function fetchWeek(week, seasontype = 2) {
  try {
    const url = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=${seasontype}&week=${week}&limit=50`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    return parseGames(data.events || []);
  } catch(_) { return []; }
}

function parseGames(events) {
  return events.map(e => {
    const comp = e.competitions?.[0];
    const home = comp?.competitors?.find(c => c.homeAway === 'home');
    const away = comp?.competitors?.find(c => c.homeAway === 'away');
    const st   = comp?.status?.type || {};
    const isLive  = !st.completed && st.state === 'in';
    const isDone  = !!st.completed;
    const homeScore = isDone || isLive ? parseInt(home?.score || 0) : null;
    const awayScore = isDone || isLive ? parseInt(away?.score || 0) : null;
    const homeName  = normalizeTeam(home?.team?.displayName || '');
    const awayName  = normalizeTeam(away?.team?.displayName || '');
    const homeTm = TEAMS[homeName];
    const awayTm = TEAMS[awayName];
    const isTie  = isDone && homeScore === awayScore;
    return {
      id: e.id,
      date: new Date(e.date),
      homeName, awayName,
      homeAbbr: (home?.team?.abbreviation || '').toLowerCase(),
      awayAbbr: (away?.team?.abbreviation || '').toLowerCase(),
      homeLogo: home?.team?.logo || (homeTm ? logoUrl(homeTm.abbr) : ''),
      awayLogo: away?.team?.logo || (awayTm ? logoUrl(awayTm.abbr) : ''),
      homeColor: homeTm?.color || '#555',
      awayColor: awayTm?.color || '#555',
      homeScore, awayScore,
      homeWin: isDone && !isTie && !!(home?.winner ?? (homeScore > awayScore)),
      awayWin: isDone && !isTie && !!(away?.winner ?? (awayScore > homeScore)),
      isTie, isDone, isLive,
      clock: comp?.status?.displayClock || '',
      quarter: comp?.status?.period || 0,
      statusDetail: comp?.status?.type?.shortDetail || '',
      isDraft: !!(homeTm || awayTm),
      homeOwner: homeTm?.owner || null,
      awayOwner: awayTm?.owner || null,
    };
  });
}

async function loadCurrentWeek() {
  try {
    const res  = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
    if (!res.ok) return;
    const data = await res.json();
    currentWeek = data.week?.number || 1;
    isPlayoffs  = data.season?.type === 3;
    viewWeek    = currentWeek;
    const el = document.getElementById('header-week');
    el.querySelector('.header-week-num').textContent   = isPlayoffs ? `WK ${currentWeek}` : `Wk ${currentWeek}`;
    el.querySelector('.header-week-label').textContent = isPlayoffs ? 'Playoffs' : '2026 NFL';
  } catch(_) {}
}

async function loadAllGames() {
  const weeks   = Array.from({ length: currentWeek }, (_, i) => i + 1);
  const results = await Promise.all(weeks.map(w => fetchWeek(w, isPlayoffs ? 3 : 2)));
  results.forEach((games, i) => { gamesCache[i + 1] = games; });
}

// ── SCORING ────────────────────────────────────────────────────────────────

function calculateScores() {
  const s = Object.fromEntries(OWNERS.map(o => [o, { wins: 0, losses: 0, ties: 0, pf: 0, pa: 0 }]));

  for (const games of Object.values(gamesCache)) {
    for (const g of games) {
      if (!g.isDone) continue;
      if (g.homeOwner) {
        const o = s[g.homeOwner];
        o.pf += g.homeScore; o.pa += g.awayScore;
        if (g.isTie) o.ties++; else if (g.homeWin) o.wins++; else o.losses++;
      }
      if (g.awayOwner) {
        const o = s[g.awayOwner];
        o.pf += g.awayScore; o.pa += g.homeScore;
        if (g.isTie) o.ties++; else if (g.awayWin) o.wins++; else o.losses++;
      }
    }
  }

  return OWNERS.map(owner => {
    const o = s[owner];
    const points = o.wins + o.ties * 0.5;
    return { owner, ...o, points, diff: o.pf - o.pa };
  }).sort((a, b) => b.points - a.points || b.diff - a.diff);
}

function getTeamRecord(teamName) {
  let wins = 0, losses = 0, ties = 0, pf = 0, pa = 0;
  for (const games of Object.values(gamesCache)) {
    for (const g of games) {
      if (!g.isDone) continue;
      const isHome = g.homeName === teamName;
      const isAway = g.awayName === teamName;
      if (!isHome && !isAway) continue;
      const myScore  = isHome ? g.homeScore : g.awayScore;
      const oppScore = isHome ? g.awayScore : g.homeScore;
      const iWon     = isHome ? g.homeWin   : g.awayWin;
      pf += myScore; pa += oppScore;
      if (g.isTie) ties++; else if (iWon) wins++; else losses++;
    }
  }
  return { wins, losses, ties, pf, pa, pts: wins + ties * 0.5 };
}

// ── HELPERS ────────────────────────────────────────────────────────────────

function fmtPts(n) { return n % 1 === 0 ? n.toFixed(0) : n.toFixed(1); }

function logoImgPair(url, abbr, color, size) {
  return `<img src="${url}" width="${size}" height="${size}" style="object-fit:contain;border-radius:4px"
    onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
  ><span style="display:none;width:${size}px;height:${size}px;border-radius:${Math.round(size/5)}px;background:${color};align-items:center;justify-content:center;font-size:${Math.round(size/3.5)}px;font-weight:800;color:#fff;">${abbr.toUpperCase()}</span>`;
}

// ── RENDER: LEADERBOARD ────────────────────────────────────────────────────

function renderLeaderboard() {
  const el     = document.getElementById('tab-leaderboard');
  const scores = calculateScores();

  const rankIcons = ['🏆','🥈','🥉'];

  el.innerHTML = `
    <div class="section-label">Draft Standings</div>
    <div class="lb-list">
      ${scores.map((s, i) => {
        const ownerTeams = Object.entries(TEAMS).filter(([, t]) => t.owner === s.owner);
        const logos = ownerTeams.map(([, t]) =>
          `<img class="lb-logo" src="${logoUrl(t.abbr)}"
            onerror="this.style.display='none'">`
        ).join('');
        const diff    = s.diff > 0 ? `+${s.diff}` : `${s.diff}`;
        const diffCls = s.diff > 0 ? 'pos' : s.diff < 0 ? 'neg' : '';
        const rank    = rankIcons[i] || `${i + 1}`;
        const record  = `${s.wins}-${s.losses}${s.ties ? `-${s.ties}` : ''}`;
        return `
          <div class="lb-card">
            <div class="lb-rank">${rank}</div>
            <div class="lb-info">
              <div class="lb-name" style="color:${OWNER_COLORS[s.owner]}">${s.owner}</div>
              <div class="lb-logos">${logos}</div>
            </div>
            <div class="lb-stats">
              <div class="lb-points">${fmtPts(s.points)}</div>
              <div class="lb-record">${record}</div>
              <div class="lb-diff ${diffCls}">${diff} diff</div>
            </div>
          </div>`;
      }).join('')}
    </div>
    <div class="scoring-note">
      <strong>Scoring:</strong>&nbsp; Win = 1 pt &nbsp;·&nbsp; Tie = 0.5 pts &nbsp;·&nbsp; Loss = 0 pts
      &nbsp;·&nbsp; Tiebreaker: point differential
    </div>`;
}

// ── RENDER: SCHEDULE ───────────────────────────────────────────────────────

function renderSchedule() {
  const el    = document.getElementById('tab-schedule');
  const games = gamesCache[viewWeek] || [];

  const prevOk = viewWeek > 1;
  const nextOk = viewWeek < currentWeek;

  let gamesHtml;

  if (!gamesCache[viewWeek]) {
    gamesHtml = '<div class="loading-msg"><div class="spinner"></div>Loading…</div>';
  } else if (games.length === 0) {
    gamesHtml = '<div class="no-games-msg">No games scheduled this week.</div>';
  } else {
    gamesHtml = `<div class="games-list">` + games.map(g => {
      const awayTm = TEAMS[g.awayName];
      const homeTm = TEAMS[g.homeName];
      const awayLogo = g.awayLogo || (awayTm ? logoUrl(awayTm.abbr) : '');
      const homeLogo = g.homeLogo || (homeTm ? logoUrl(homeTm.abbr) : '');

      // Owner badges
      const awayBadge = g.awayOwner
        ? `<span class="owner-badge" style="background:${OWNER_COLORS[g.awayOwner]}">${g.awayOwner}</span>` : '';
      const homeBadge = g.homeOwner
        ? `<span class="owner-badge" style="background:${OWNER_COLORS[g.homeOwner]}">${g.homeOwner}</span>` : '';

      // Score / time block
      let scoreHtml;
      if (g.isDone) {
        const aStyle = g.awayWin ? 'color:var(--win);' : g.homeWin ? 'opacity:.45' : '';
        const hStyle = g.homeWin ? 'color:var(--win);' : g.awayWin ? 'opacity:.45' : '';
        scoreHtml = `
          <div class="score-nums">
            <span style="${aStyle}">${g.awayScore}</span>
            <span class="score-sep">-</span>
            <span style="${hStyle}">${g.homeScore}</span>
          </div>
          <div class="score-status">Final</div>`;
      } else if (g.isLive) {
        scoreHtml = `
          <div class="score-nums">${g.awayScore} <span class="score-sep">-</span> ${g.homeScore}</div>
          <div class="score-status live"><span class="live-dot"></span>Q${g.quarter} ${g.clock}</div>`;
      } else {
        const timeStr = g.date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        const dateStr = g.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        scoreHtml = `
          <div class="score-time">${timeStr}<br><span style="font-size:10px">${dateStr}</span></div>`;
      }

      // Short team name (last word) for small display
      const awayShort = g.awayName.split(' ').slice(-1)[0];
      const homeShort = g.homeName.split(' ').slice(-1)[0];

      return `
        <div class="game-card">
          <div class="game-team">
            <img src="${awayLogo}" class="game-logo"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
            ><span class="game-logo-fb" style="background:${g.awayColor}">${(g.awayAbbr || awayShort.slice(0,3)).toUpperCase()}</span>
            <div class="game-team-name">${g.awayName}</div>
            ${awayBadge}
          </div>
          <div class="score-block">${scoreHtml}</div>
          <div class="game-team">
            <img src="${homeLogo}" class="game-logo"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
            ><span class="game-logo-fb" style="background:${g.homeColor}">${(g.homeAbbr || homeShort.slice(0,3)).toUpperCase()}</span>
            <div class="game-team-name">${g.homeName}</div>
            ${homeBadge}
          </div>
        </div>`;
    }).join('') + `</div>`;
  }

  el.innerHTML = `
    <div class="week-nav">
      <button class="week-nav-btn" ${prevOk ? '' : 'disabled'} onclick="changeWeek(-1)">◀ Prev</button>
      <span class="week-label-text">Week ${viewWeek}</span>
      <button class="week-nav-btn" ${nextOk ? '' : 'disabled'} onclick="changeWeek(1)">Next ▶</button>
    </div>
    ${gamesHtml}`;
}

// ── RENDER: TEAMS ──────────────────────────────────────────────────────────

function renderTeams() {
  const el     = document.getElementById('tab-teams');
  const scores = calculateScores();

  el.innerHTML = `
    <div class="section-label">Draft Rosters</div>
    <div class="teams-grid">
      ${scores.map(s => {
        const ownerTeams = Object.entries(TEAMS).filter(([, t]) => t.owner === s.owner);
        const rowsHtml = ownerTeams.map(([name, t]) => {
          const rec    = getTeamRecord(name);
          const record = `${rec.wins}-${rec.losses}${rec.ties ? `-${rec.ties}` : ''}`;
          return `
            <div class="team-row">
              <img src="${logoUrl(t.abbr)}" class="team-row-logo"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
              ><span class="team-row-logo-fb" style="background:${t.color}">${t.abbr.toUpperCase()}</span>
              <span class="team-row-name">${name}</span>
              <div class="team-row-right">
                <span class="team-row-record">${record}</span>
                <span class="team-row-pts">${fmtPts(rec.pts)} pts</span>
              </div>
            </div>`;
        }).join('');

        return `
          <div class="participant-card">
            <div class="participant-header">
              <div class="participant-avatar" style="background:${OWNER_COLORS[s.owner]}">${s.owner[0]}</div>
              <span class="participant-name">${s.owner}</span>
              <span class="participant-pts">${fmtPts(s.points)} pts</span>
            </div>
            <div>${rowsHtml}</div>
          </div>`;
      }).join('')}
    </div>`;
}

// ── INTERACTIONS ───────────────────────────────────────────────────────────

function changeWeek(delta) {
  viewWeek = Math.max(1, Math.min(currentWeek, viewWeek + delta));
  renderSchedule();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
  });
});

// ── SERVICE WORKER ─────────────────────────────────────────────────────────

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/SNL-NFL-2026-Draft/sw.js').catch(() => {});
}

// ── INIT ───────────────────────────────────────────────────────────────────

async function init() {
  await loadCurrentWeek();
  await loadAllGames();
  renderLeaderboard();
  renderSchedule();
  renderTeams();

  setInterval(async () => {
    await loadAllGames();
    renderLeaderboard();
    renderSchedule();
    renderTeams();
  }, 3 * 60 * 1000);
}

init();
</script>
</body>
</html>
