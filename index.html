<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNL NFL Draft 2026</title>
<meta name="description" content="SNL NFL Draft League Tracker — 2026 Season">
<meta name="theme-color" content="#013369">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --header-bg: #013369;
  --header-text: #ffffff;
  --nfl-red: #d50a0a;
  --accent: #013369;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --win: #15803d;
  --loss: #dc2626;
  --tie: #d97706;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.05);
  --radius: 14px;
  --radius-sm: 8px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a;
    --surface: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #334155;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
    --shadow-md: 0 4px 6px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --border: #334155;
  --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
  --shadow-md: 0 4px 6px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.3);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ---- HEADER ---- */
.app-header {
  background: var(--header-bg);
  color: var(--header-text);
  padding: 14px 16px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.3);
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 12px;
}

.header-icon {
  font-size: 26px;
  line-height: 1;
  flex-shrink: 0;
}

.header-text h1 {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -.2px;
  line-height: 1.15;
}

.header-text p {
  font-size: 11px;
  opacity: .65;
  margin-top: 2px;
  font-weight: 500;
  letter-spacing: .3px;
  text-transform: uppercase;
}

.header-week {
  margin-left: auto;
  text-align: right;
  flex-shrink: 0;
}

.header-week-num {
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
  display: block;
}

.header-week-label {
  font-size: 11px;
  opacity: .6;
  font-weight: 500;
}

/* ---- TABS ---- */
.tab-nav {
  display: flex;
  gap: 0;
  border-top: 1px solid rgba(255,255,255,.12);
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-nav::-webkit-scrollbar { display: none; }

.tab-btn {
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  color: rgba(255,255,255,.55);
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: .2px;
  transition: color .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
}
.tab-btn:hover { color: rgba(255,255,255,.85); }
.tab-btn.active { color: #fff; border-bottom-color: var(--nfl-red); }

/* ---- MAIN CONTENT ---- */
.main { padding: 16px 24px; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ---- LOADING ---- */
.loading-msg {
  text-align: center;
  padding: 48px 16px;
  color: var(--muted);
  font-size: 14px;
}
.spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .75s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- SECTION LABEL ---- */
.section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .9px;
  color: var(--muted);
  padding: 2px 2px 8px;
}

/* ---- LEADERBOARD ---- */
.lb-list { display: flex; flex-direction: column; gap: 8px; }

.lb-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
  display: flex;
  align-items: center;
  gap: 18px;
}

.lb-rank {
  font-size: 32px;
  font-weight: 900;
  color: var(--muted);
  min-width: 42px;
  text-align: center;
  flex-shrink: 0;
}

.lb-info { flex: 1; min-width: 0; }

.lb-name {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 8px;
  letter-spacing: -.2px;
}

.lb-logos {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.lb-logo {
  width: 44px;
  height: 44px;
  object-fit: contain;
  border-radius: 8px;
}

.lb-stats {
  text-align: right;
  flex-shrink: 0;
  min-width: 96px;
}

.lb-points {
  font-size: 40px;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}

.lb-record {
  font-size: 15px;
  color: var(--muted);
  font-weight: 600;
  margin-top: 5px;
  font-variant-numeric: tabular-nums;
}

.lb-diff {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
  margin-top: 3px;
}
.lb-diff.pos { color: var(--win); }
.lb-diff.neg { color: var(--loss); }

.scoring-note {
  margin-top: 12px;
  padding: 10px 14px;
  background: var(--surface);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

/* ---- SCHEDULE ---- */
.week-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 10px 14px;
  margin-bottom: 12px;
}

.week-nav-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  color: var(--text);
  transition: background .15s;
  -webkit-tap-highlight-color: transparent;
}
.week-nav-btn:hover:not(:disabled) { background: var(--border); }
.week-nav-btn:disabled { opacity: .3; cursor: default; }

.week-label-text {
  font-size: 15px;
  font-weight: 800;
}

.games-list { display: flex; flex-direction: column; gap: 8px; }

.game-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px 14px;
  display: grid;
  grid-template-columns: 1fr 80px 1fr;
  align-items: center;
  gap: 6px;
}

.game-team {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
}

.game-logo-wrap {
  position: relative;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.game-logo {
  width: 42px;
  height: 42px;
  object-fit: contain;
}

.game-logo-fb {
  display: none;
  width: 42px;
  height: 42px;
  border-radius: 8px;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  color: white;
}

.game-team-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
  max-width: 90px;
}

.owner-badge {
  font-size: 10px;
  font-weight: 700;
  border-radius: 20px;
  padding: 2px 7px;
  color: white;
  line-height: 1.4;
}

.score-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.score-nums {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.score-sep {
  color: var(--muted);
  font-size: 14px;
  margin: 0 2px;
  font-weight: 400;
}

.score-status {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  text-align: center;
}
.score-status.live { color: var(--nfl-red); font-weight: 700; }

.score-time {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
}

.no-games-msg {
  text-align: center;
  color: var(--muted);
  padding: 40px 16px;
  font-size: 14px;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ---- TEAMS TAB ---- */
.teams-grid { display: flex; flex-direction: column; gap: 10px; }

.participant-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.participant-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}

.participant-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
  color: white;
  flex-shrink: 0;
}

.participant-name {
  font-size: 15px;
  font-weight: 800;
  flex: 1;
}

.participant-pts {
  font-size: 15px;
  font-weight: 900;
  color: var(--accent);
}

.team-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
}
.team-row + .team-row { border-top: 1px solid var(--border); }

.team-row-logo {
  width: 34px;
  height: 34px;
  object-fit: contain;
  flex-shrink: 0;
}

.team-row-logo-fb {
  display: none;
  width: 34px;
  height: 34px;
  border-radius: 7px;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 800;
  color: white;
  flex-shrink: 0;
}

.team-row-name {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
}

.team-row-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}

.team-row-record {
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.team-row-pts {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}

/* ---- OWNER GROUP ---- */
.lb-owner-group {
  display: flex;
  flex-direction: row;
  gap: 8px;
  align-items: stretch;
  overflow: hidden;
}
.lb-owner-group .lb-card {
  flex: 2 1 0;
  min-width: 0;
  overflow: hidden;
}
.lb-owner-group .performers-card {
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
}
@media (max-width: 600px) {
  .lb-owner-group { flex-direction: column; }
  .lb-owner-group .performers-card { flex: none; }
}

/* ---- LOSING TEAMS ROW ---- */
.week-results {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 5px;
}
.week-result-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 20px;
  padding: 3px 9px 3px 5px;
  font-size: 12px;
  font-weight: 700;
}
.week-result-chip.win  { background: rgba(21,128,61,.12); color: var(--win); }
.week-result-chip.loss { background: rgba(220,38,38,.1);  color: var(--loss); }
.week-result-chip.tie  { background: rgba(217,119,6,.1);  color: var(--tie); }

/* ---- PERFORMERS CARD ---- */
.performers-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 10px 14px;
  border-left: 3px solid var(--nfl-red);
}
.performers-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .7px;
  color: var(--muted);
  margin-bottom: 8px;
}
.performers-list { display: flex; flex-direction: column; gap: 6px; }
.performer-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.performer-headshot {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--border);
}
.performer-headshot-fb {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  color: white;
}
.performer-info { flex: 1; min-width: 0; }
.performer-name {
  font-size: 14px;
  font-weight: 700;
}
.performer-team {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 3px;
  margin-top: 1px;
}
.performer-stat { text-align: right; flex-shrink: 0; }
.performer-value {
  font-size: 14px;
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.performer-cat {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
}

/* ---- THIS WEEK'S MATCHUPS ---- */
.matchups-section {
  margin-bottom: 12px;
}
.matchups-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.matchup-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px 16px;
  flex: 1 1 280px;
  border-top: 3px solid var(--nfl-red);
}
.matchup-header {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .7px;
  color: var(--muted);
  margin-bottom: 10px;
}
.matchup-teams {
  display: flex;
  align-items: center;
  gap: 10px;
}
.matchup-side {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
}
.matchup-logo {
  width: 48px;
  height: 48px;
  object-fit: contain;
}
.matchup-team-name {
  font-size: 12px;
  font-weight: 700;
  line-height: 1.2;
}
.matchup-owner-name {
  font-size: 11px;
  font-weight: 700;
  border-radius: 20px;
  padding: 2px 8px;
  color: white;
}
.matchup-vs {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 60px;
}
.matchup-score {
  font-size: 22px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.matchup-vs-label {
  font-size: 13px;
  font-weight: 800;
  color: var(--muted);
}
.matchup-status {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  margin-top: 2px;
  text-align: center;
}
.matchup-status.live { color: var(--nfl-red); font-weight: 700; }
.matchup-date {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 6px;
  font-weight: 500;
}

/* ---- LIVE BANNER ---- */
.live-banner {
  background: linear-gradient(135deg, #1a0505, #2d0808);
  border: 1px solid rgba(213,10,10,.4);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 10px;
  font-size: 12px;
  color: #fff;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.live-game {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
}
.live-owner {
  font-size: 10px;
  font-weight: 700;
  border-radius: 20px;
  padding: 1px 6px;
  color: white;
}
.live-clock {
  font-size: 10px;
  opacity: .7;
}
.live-divider {
  color: rgba(255,255,255,.3);
  margin: 0 2px;
}

/* ---- MOMENTUM ROW ---- */
.momentum-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}
.momentum-item {
  background: var(--surface);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 13px;
}
.momentum-item strong { font-size: 14px; font-weight: 800; }
.momentum-item span   { font-size: 11px; color: var(--muted); }
.momentum-item.hot { border-left: 3px solid var(--win); }
.momentum-item.cold { border-left: 3px solid var(--loss); }

/* ---- LB CARD ENHANCEMENTS ---- */
.lb-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.week-pts-badge {
  font-size: 12px;
  font-weight: 700;
  background: var(--bg);
  border-radius: 20px;
  padding: 2px 8px;
}

/* Last game result */
.last-game {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 5px;
}
.last-result {
  font-size: 10px;
  font-weight: 800;
  border-radius: 4px;
  padding: 1px 5px;
  color: white;
}
.last-result.last-win  { background: var(--win); }
.last-result.last-loss { background: var(--loss); }
.last-result.last-tie  { background: var(--tie); }
.last-score {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}

/* Points breakdown bar */
.pts-bar {
  display: flex;
  border-radius: 4px;
  overflow: hidden;
  height: 6px;
  gap: 1px;
  margin-bottom: 3px;
}
.bar-seg {
  border-radius: 2px;
  min-width: 4px;
  transition: flex .3s ease;
}
.pts-bar-labels {
  display: flex;
  gap: 8px;
}
.bar-label {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  color: var(--muted);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* ---- MISC ---- */
.live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--nfl-red);
  margin-right: 3px;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .3; }
}
</style>
</head>

<body>

<header class="app-header">
  <div class="header-top">
    <div class="header-icon">🏈</div>
    <div class="header-text">
      <h1>SNL NFL Draft</h1>
      <p>2026 Season Tracker</p>
    </div>
    <div class="header-week" id="header-week">
      <span class="header-week-num">—</span>
      <span class="header-week-label">Loading</span>
    </div>
  </div>
  <nav class="tab-nav" role="tablist">
    <button class="tab-btn active" data-tab="leaderboard" role="tab">Leaderboard</button>
    <button class="tab-btn" data-tab="schedule" role="tab">Schedule</button>
    <button class="tab-btn" data-tab="teams" role="tab">Teams</button>
  </nav>
</header>

<main class="main">
  <div id="tab-leaderboard" class="tab-panel active" role="tabpanel">
    <div class="loading-msg"><div class="spinner"></div>Loading scores…</div>
  </div>
  <div id="tab-schedule" class="tab-panel" role="tabpanel">
    <div class="loading-msg"><div class="spinner"></div>Loading schedule…</div>
  </div>
  <div id="tab-teams" class="tab-panel" role="tabpanel">
    <div class="loading-msg"><div class="spinner"></div>Loading rosters…</div>
  </div>
</main>

<script>
'use strict';

// ── CONSTANTS ──────────────────────────────────────────────────────────────

const TEAMS = {
  'Seattle Seahawks':      { abbr: 'sea', owner: 'Mike',   color: '#002244' },
  'Chicago Bears':         { abbr: 'chi', owner: 'Mike',   color: '#0b1f48' },
  'Cincinnati Bengals':    { abbr: 'cin', owner: 'Mike',   color: '#fb4f14' },
  'Buffalo Bills':         { abbr: 'buf', owner: 'Carlos', color: '#00338d' },
  'Houston Texans':        { abbr: 'hou', owner: 'Carlos', color: '#03202f' },
  'Jacksonville Jaguars':  { abbr: 'jax', owner: 'Carlos', color: '#006778' },
  'Los Angeles Rams':      { abbr: 'lar', owner: 'Leury',  color: '#003594' },
  'Dallas Cowboys':        { abbr: 'dal', owner: 'Leury',  color: '#003594' },

// ESPN display name → our canonical name if they differ
const ESPN_NAME_MAP = {
  'Washington Commanders': 'Washington Commanders',
};

function normalizeTeam(n) { return ESPN_NAME_MAP[n] || n; }
function logoUrl(abbr)    { return `https://a.espncdn.com/i/teamlogos/nfl/500/${abbr}.png`; }

// ── STATE ──────────────────────────────────────────────────────────────────

let gamesCache  = {};   // week (string) → game[]
let currentWeek = 1;
let viewWeek    = 1;
let isPlayoffs  = false;

// ── ESPN API ───────────────────────────────────────────────────────────────

async function fetchWeek(week, seasontype = 2) {
  try {
    const url = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=${seasontype}&week=${week}&limit=50`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    return parseGames(data.events || []);
  } catch(_) { return []; }
}

function parseGames(events) {
  return events.map(e => {
    const comp = e.competitions?.[0];
    const home = comp?.competitors?.find(c => c.homeAway === 'home');
    const away = comp?.competitors?.find(c => c.homeAway === 'away');
    const st   = comp?.status?.type || {};
    const isLive  = !st.completed && st.state === 'in';
    const isDone  = !!st.completed;
    const homeScore = isDone || isLive ? parseInt(home?.score || 0) : null;
    const awayScore = isDone || isLive ? parseInt(away?.score || 0) : null;
    const homeName  = normalizeTeam(home?.team?.displayName || '');
    const awayName  = normalizeTeam(away?.team?.displayName || '');
    const homeTm = TEAMS[homeName];
    const awayTm = TEAMS[awayName];
    const isTie  = isDone && homeScore === awayScore;
    return {
      id: e.id,
      date: new Date(e.date),
      homeName, awayName,
      homeAbbr: (home?.team?.abbreviation || '').toLowerCase(),
      awayAbbr: (away?.team?.abbreviation || '').toLowerCase(),
      homeLogo: home?.team?.logo || (homeTm ? logoUrl(homeTm.abbr) : ''),
      awayLogo: away?.team?.logo || (awayTm ? logoUrl(awayTm.abbr) : ''),
      homeColor: homeTm?.color || '#555',
      awayColor: awayTm?.color || '#555',
      homeScore, awayScore,
      homeWin: isDone && !isTie && !!(home?.winner ?? (homeScore > awayScore)),
      awayWin: isDone && !isTie && !!(away?.winner ?? (awayScore > homeScore)),
      isTie, isDone, isLive,
      clock: comp?.status?.displayClock || '',
      quarter: comp?.status?.period || 0,
      statusDetail: comp?.status?.type?.shortDetail || '',
      isDraft: !!(homeTm || awayTm),
      homeOwner: homeTm?.owner || null,
      awayOwner: awayTm?.owner || null,
      leaders: parseLeaders(comp?.leaders || [], homeName, awayName),
    };
  });
}

function parseLeaders(leaders, homeName, awayName) {
  const statMap = { passingYards: 'PASS', rushingYards: 'RUSH', receivingYards: 'REC' };
  const out = [];
  for (const cat of leaders) {
    const key = statMap[cat.name];
    if (!key) continue;
    const top = cat.leaders?.[0];
    if (!top) continue;
    const teamId   = top.team?.id;
    const compHome = leaders[0]?.leaders?.[0]; // used below just to find team
    // resolve team name from competitor team id
    const teamName = top.athlete?.team?.displayName
      ? normalizeTeam(top.athlete.team.displayName)
      : null;
    out.push({
      stat: key,
      name: top.athlete?.displayName || '',
      value: top.displayValue || '',
      headshot: top.athlete?.headshot?.href || top.athlete?.headshot || (top.athlete?.id ? `https://a.espncdn.com/i/headshots/nfl/players/full/${top.athlete.id}.png` : ''),
      teamName: teamName || homeName,
      teamOwner: teamName ? (TEAMS[teamName]?.owner || null) : null,
      teamColor: teamName ? (TEAMS[teamName]?.color || '#555') : '#555',
      teamAbbr:  teamName ? (TEAMS[teamName]?.abbr  || '')    : '',
    });
  }
  return out;
}

async function loadCurrentWeek() {
  try {
    const res  = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
    if (!res.ok) return;
    const data = await res.json();
    currentWeek = data.week?.number || 1;
    isPlayoffs  = data.season?.type === 3;
    viewWeek    = currentWeek;
    const el = document.getElementById('header-week');
    el.querySelector('.header-week-num').textContent   = isPlayoffs ? `WK ${currentWeek}` : `Wk ${currentWeek}`;
    el.querySelector('.header-week-label').textContent = isPlayoffs ? 'Playoffs' : '2026 NFL';
  } catch(_) {}
}

async function loadAllGames() {
  const weeks   = Array.from({ length: currentWeek }, (_, i) => i + 1);
  const results = await Promise.all(weeks.map(w => fetchWeek(w, isPlayoffs ? 3 : 2)));
  results.forEach((games, i) => { gamesCache[i + 1] = games; });
}

// ── SCORING ────────────────────────────────────────────────────────────────

function calculateScores() {
  const s = Object.fromEntries(OWNERS.map(o => [o, { wins: 0, losses: 0, ties: 0, pf: 0, pa: 0 }]));

  for (const games of Object.values(gamesCache)) {
    for (const g of games) {
      if (!g.isDone) continue;
      if (g.homeOwner) {
        const o = s[g.homeOwner];
        o.pf += g.homeScore; o.pa += g.awayScore;
        if (g.isTie) o.ties++; else if (g.homeWin) o.wins++; else o.losses++;
      }
      if (g.awayOwner) {
        const o = s[g.awayOwner];
        o.pf += g.awayScore; o.pa += g.homeScore;
        if (g.isTie) o.ties++; else if (g.awayWin) o.wins++; else o.losses++;
      }
    }
  }

  return OWNERS.map(owner => {
    const o = s[owner];
    const points = o.wins + o.ties * 0.5;
    return { owner, ...o, points, diff: o.pf - o.pa };
  }).sort((a, b) => b.points - a.points || b.diff - a.diff);
}

function getTeamRecord(teamName) {
  let wins = 0, losses = 0, ties = 0, pf = 0, pa = 0;
  for (const games of Object.values(gamesCache)) {
    for (const g of games) {
      if (!g.isDone) continue;
      const isHome = g.homeName === teamName;
      const isAway = g.awayName === teamName;
      if (!isHome && !isAway) continue;
      const myScore  = isHome ? g.homeScore : g.awayScore;
      const oppScore = isHome ? g.awayScore : g.homeScore;
      const iWon     = isHome ? g.homeWin   : g.awayWin;
      pf += myScore; pa += oppScore;
      if (g.isTie) ties++; else if (iWon) wins++; else losses++;
    }
  }
  return { wins, losses, ties, pf, pa, pts: wins + ties * 0.5 };
}

// ── HELPERS ────────────────────────────────────────────────────────────────

function fmtPts(n) { return n % 1 === 0 ? n.toFixed(0) : n.toFixed(1); }

// Live games involving drafted teams
function getLiveGames() {
  return (gamesCache[currentWeek] || []).filter(g => g.isLive && g.isDraft);
}

// Points earned this week only (for momentum row)
function getWeekPoints(owner, week) {
  let pts = 0;
  for (const g of (gamesCache[week] || [])) {
    if (!g.isDone) continue;
    if (g.homeOwner === owner) pts += g.isTie ? 0.5 : g.homeWin ? 1 : 0;
    if (g.awayOwner === owner) pts += g.isTie ? 0.5 : g.awayWin ? 1 : 0;
  }
  return pts;
}

// Per-team points contribution for breakdown bar
function getTeamPts(teamName) {
  let pts = 0;
  for (const games of Object.values(gamesCache)) {
    for (const g of games) {
      if (!g.isDone) continue;
      const isHome = g.homeName === teamName;
      const isAway = g.awayName === teamName;
      if (!isHome && !isAway) continue;
      const iWon = isHome ? g.homeWin : g.awayWin;
      if (g.isTie) pts += 0.5; else if (iWon) pts += 1;
    }
  }
  return pts;
}

// Games this week where both teams are drafted (owner vs owner)
function getOwnerMatchups() {
  return (gamesCache[currentWeek] || []).filter(g => g.homeOwner && g.awayOwner);
}

// This week's W/L/T result for each of an owner's teams
function getWeekTeamResults(owner) {
  const ownerTeams = Object.entries(TEAMS).filter(([,t]) => t.owner === owner);
  return ownerTeams.map(([name, t]) => {
    const game = (gamesCache[currentWeek] || []).find(g =>
      (g.isDone || g.isLive) && (g.homeName === name || g.awayName === name)
    );
    if (!game) return { name, t, result: null };
    const isHome = game.homeName === name;
    const myScore  = isHome ? game.homeScore : game.awayScore;
    const oppScore = isHome ? game.awayScore : game.homeScore;
    const iWon     = isHome ? game.homeWin   : game.awayWin;
    const result   = game.isTie ? 'tie' : iWon ? 'win' : 'loss';
    const opp      = (isHome ? game.awayName : game.homeName).split(' ').slice(-1)[0];
    return { name, t, result, myScore, oppScore, opp };
  });
}

// Top performers from the current week for a given owner's teams
function getTopPerformers(owner) {
  const ownerTeams = new Set(Object.entries(TEAMS).filter(([,t]) => t.owner === owner).map(([n]) => n));
  const seen = new Set();
  const performers = [];
  for (const g of (gamesCache[currentWeek] || [])) {
    if (!g.isDone && !g.isLive) continue;
    for (const l of (g.leaders || [])) {
      if (!ownerTeams.has(l.teamName)) continue;
      const key = l.name + l.stat;
      if (seen.has(key)) continue;
      seen.add(key);
      performers.push(l);
    }
  }
  return performers;
}

// Most recent completed game for any of an owner's teams
function getLastGame(owner) {
  const allDone = [];
  for (const games of Object.values(gamesCache)) {
    for (const g of games) {
      if (!g.isDone) continue;
      if (g.homeOwner === owner || g.awayOwner === owner) allDone.push(g);
    }
  }
  if (!allDone.length) return null;
  allDone.sort((a, b) => b.date - a.date);
  const g = allDone[0];
  const isHome = g.homeOwner === owner;
  const myTeam   = isHome ? g.homeName : g.awayName;
  const oppTeam  = isHome ? g.awayName : g.homeName;
  const myScore  = isHome ? g.homeScore : g.awayScore;
  const oppScore = isHome ? g.awayScore : g.homeScore;
  const iWon     = isHome ? g.homeWin   : g.awayWin;
  const result   = g.isTie ? 'T' : iWon ? 'W' : 'L';
  const abbr     = TEAMS[myTeam]?.abbr || '';
  return { myTeam, oppTeam, myScore, oppScore, result, abbr };
}

function logoImgPair(url, abbr, color, size) {
  return `<img src="${url}" width="${size}" height="${size}" style="object-fit:contain;border-radius:4px"
    onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
  ><span style="display:none;width:${size}px;height:${size}px;border-radius:${Math.round(size/5)}px;background:${color};align-items:center;justify-content:center;font-size:${Math.round(size/3.5)}px;font-weight:800;color:#fff;">${abbr.toUpperCase()}</span>`;
}

      const homeLogo = g.homeLogo || (homeTm ? logoUrl(homeTm.abbr) : '');

      // Owner badges
      const awayBadge = g.awayOwner
        ? `<span class="owner-badge" style="background:${OWNER_COLORS[g.awayOwner]}">${g.awayOwner}</span>` : '';
      const homeBadge = g.homeOwner
        ? `<span class="owner-badge" style="background:${OWNER_COLORS[g.homeOwner]}">${g.homeOwner}</span>` : '';

      // Score / time block
      let scoreHtml;
      if (g.isDone) {
        const aStyle = g.awayWin ? 'color:var(--win);' : g.homeWin ? 'opacity:.45' : '';
        const hStyle = g.homeWin ? 'color:var(--win);' : g.awayWin ? 'opacity:.45' : '';
        scoreHtml = `
          <div class="score-nums">
            <span style="${aStyle}">${g.awayScore}</span>
            <span class="score-sep">-</span>
            <span style="${hStyle}">${g.homeScore}</span>
          </div>
          <div class="score-status">Final</div>`;
      } else if (g.isLive) {
        scoreHtml = `
          <div class="score-nums">${g.awayScore} <span class="score-sep">-</span> ${g.homeScore}</div>
          <div class="score-status live"><span class="live-dot"></span>Q${g.quarter} ${g.clock}</div>`;
      } else {
        const timeStr = g.date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        const dateStr = g.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        scoreHtml = `
          <div class="score-time">${timeStr}<br><span style="font-size:10px">${dateStr}</span></div>`;
      }

      // Short team name (last word) for small display
      const awayShort = g.awayName.split(' ').slice(-1)[0];
      const homeShort = g.homeName.split(' ').slice(-1)[0];

      return `
        <div class="game-card">
          <div class="game-team">
            <img src="${awayLogo}" class="game-logo"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
            ><span class="game-logo-fb" style="background:${g.awayColor}">${(g.awayAbbr || awayShort.slice(0,3)).toUpperCase()}</span>
            <div class="game-team-name">${g.awayName}</div>
            ${awayBadge}
          </div>
          <div class="score-block">${scoreHtml}</div>
          <div class="game-team">
            <img src="${homeLogo}" class="game-logo"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
            ><span class="game-logo-fb" style="background:${g.homeColor}">${(g.homeAbbr || homeShort.slice(0,3)).toUpperCase()}</span>
            <div class="game-team-name">${g.homeName}</div>
            ${homeBadge}
          </div>
        </div>`;
    }).join('') + `</div>`;
  }

  el.innerHTML = `
    <div class="week-nav">
      <button class="week-nav-btn" ${prevOk ? '' : 'disabled'} onclick="changeWeek(-1)">◀ Prev</button>
      <span class="week-label-text">Week ${viewWeek}</span>
      <button class="week-nav-btn" ${nextOk ? '' : 'disabled'} onclick="changeWeek(1)">Next ▶</button>
    </div>
    ${gamesHtml}`;
}

// ── RENDER: TEAMS ──────────────────────────────────────────────────────────

function renderTeams() {
  const el     = document.getElementById('tab-teams');
  const scores = calculateScores();

  el.innerHTML = `
    <div class="section-label">Draft Rosters</div>
    <div class="teams-grid">
      ${scores.map(s => {
        const ownerTeams = Object.entries(TEAMS).filter(([, t]) => t.owner === s.owner);
        const rowsHtml = ownerTeams.map(([name, t]) => {
          const rec    = getTeamRecord(name);
          const record = `${rec.wins}-${rec.losses}${rec.ties ? `-${rec.ties}` : ''}`;
          return `
            <div class="team-row">
              <img src="${logoUrl(t.abbr)}" class="team-row-logo"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
              ><span class="team-row-logo-fb" style="background:${t.color}">${t.abbr.toUpperCase()}</span>
              <span class="team-row-name">${name}</span>
              <div class="team-row-right">
                <span class="team-row-record">${record}</span>
                <span class="team-row-pts">${fmtPts(rec.pts)} pts</span>
              </div>
            </div>`;
        }).join('');

        return `
          <div class="participant-card">
            <div class="participant-header">
              <div class="participant-avatar" style="background:${OWNER_COLORS[s.owner]}">${s.owner[0]}</div>
              <span class="participant-name">${s.owner}</span>
              <span class="participant-pts">${fmtPts(s.points)} pts</span>
            </div>
            <div>${rowsHtml}</div>
          </div>`;
      }).join('')}
    </div>`;
}

// ── INTERACTIONS ───────────────────────────────────────────────────────────

async function changeWeek(delta) {
  const maxWeek = isPlayoffs ? 4 : 18;
  viewWeek = Math.max(1, Math.min(maxWeek, viewWeek + delta));
  if (!gamesCache[viewWeek]) {
    renderSchedule();
    gamesCache[viewWeek] = await fetchWeek(viewWeek, isPlayoffs ? 3 : 2);
  }
  renderSchedule();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
  });
});

// ── SERVICE WORKER ─────────────────────────────────────────────────────────

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/SNL-NFL-2026-Draft/sw.js').catch(() => {});
}

// ── INIT ───────────────────────────────────────────────────────────────────

async function init() {
  await loadCurrentWeek();
  await loadAllGames();
  renderLeaderboard();
  renderSchedule();
  renderTeams();

  setInterval(async () => {
    await loadAllGames();
    renderLeaderboard();
    renderSchedule();
    renderTeams();
  }, 3 * 60 * 1000);
}

init();
</script>
</body>
</html>
